[project]
name = "zero2one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chintak Sheth", email = "3398558+chintak@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "rich>=15.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zero2one"]

# Resolve imports from the uv venv (pyright otherwise uses python3 on PATH).
[tool.pyright]
venvPath = "."
venv = ".venv"

# target-version is inferred from requires-python; line-length is ruff's 88 default.
[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
