[project]
name = "zero2one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chintak Sheth", email = "3398558+chintak@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pyright>=1.1.414",
    "rich>=15.0.0",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zero2one"]
