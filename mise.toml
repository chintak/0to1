# mise owns the uv binary, shell activation and tasks. uv owns Python
# (.python-version) and all Python deps, including the dev tools ruff and
# pyright (pyproject.toml dev group, pinned in uv.lock).
# Tool config lives in ruff.toml and pyrightconfig.json.

min_version = "2026.11.0"

[tools]
uv = "0.13.7"

[settings]
# On cd, activate this project's .venv (VIRTUAL_ENV + .venv/bin on PATH).
# "source" only activates; run `mise run sync` (uv sync) to create/update it.
# Editors and LSPs (pyright, ruff in hx) resolve the venv and its tools via
# PATH, so launch them from an activated shell.
python.uv_venv_auto = "source"

# ── environment ─────────────────────────────────────────────────────────
[tasks.sync]
description = "Create/update .venv from uv.lock (includes the dev group)"
run = "uv sync"

[tasks.lock]
description = "Re-resolve uv.lock after editing pyproject.toml"
run = "uv lock"

[tasks.upgrade]
description = "Upgrade all locked deps to the newest allowed versions, then sync"
run = ["uv lock --upgrade", "uv sync"]

[tasks.clean]
description = "Remove build artifacts and tool caches (keeps .venv)"
run = "rm -rf build dist .ruff_cache .pytest_cache && find . -path ./.venv -prune -o -name __pycache__ -type d -exec rm -rf {} +"

# ── quality ─────────────────────────────────────────────────────────────
[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check"

[tasks.fmt]
description = "Autofix lint issues and format with ruff"
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

[tasks.check]
description = "Lint, format-check and type-check (CI gate)"
depends = ["lint", "typecheck"]
run = "uv run ruff format --check"

# ── ML / notebooks ──────────────────────────────────────────────────────
[tasks.torch-info]
description = "Show torch/numpy versions and available accelerators"
run = """
uv run python -c '
import numpy, torch
print("torch", torch.__version__, "| numpy", numpy.__version__)
print("mps:", torch.backends.mps.is_available(), "| cuda:", torch.cuda.is_available())
'
"""

[tasks.kernel]
description = "Register .venv as the 'zero2one' Jupyter kernel"
run = "uv run python -m ipykernel install --user --name zero2one --display-name 'Python (zero2one)'"

[tasks.lab]
description = "Start JupyterLab in the project venv"
run = "uv run jupyter lab"
